name: ASKİ Su Kesintisi Kontrolü

on:
  schedule:
    # Her 10 dakikada bir çalış
    - cron: "*/10 * * * *"
  workflow_dispatch: # Manuel tetikleme

permissions:
  contents: write

jobs:
  check-and-tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for new kesintiler and tweet
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: twitter-api-v1-1-enterprise.p.rapidapi.com
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWEET_MAX_LENGTH: ${{ secrets.TWEET_MAX_LENGTH || '280' }}
          MAX_TWEET_RETRIES: ${{ secrets.MAX_TWEET_RETRIES || '100' }}
          TWEET_RETRY_DELAY_MS: ${{ secrets.TWEET_RETRY_DELAY_MS || '5000' }}
        run: npm run dev -- --once

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/kesintiler.json data/run.log
          git diff --staged --quiet || git commit -m "chore: kesintiler.json güncellendi [skip ci]"
          git push
