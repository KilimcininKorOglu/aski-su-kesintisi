name: aski-su-kesintisi

# Outbound-only bot: scrapes ASKİ and calls RapidAPI/Gemini over HTTPS.
# It runs no inbound listener, so no host port is published and no port
# block is reserved in the central Docker port registry.
services:
  bot:
    build: .
    container_name: aski-su-kesintisi
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
